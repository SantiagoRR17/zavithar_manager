org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# R8 "full mode" is AGP 8's default and is more aggressive than the classic
# optimiser — in particular it strips the generic signatures Gson needs to
# resolve a TypeToken.
#
# That broke scheduled notifications in release builds, and broke them in the
# worst way available: the alarm was registered, the receiver was woken at the
# right moment, and nothing appeared. No crash, nothing in logcat. An immediate
# notification worked perfectly, because it never goes through the
# serialise-to-disk-and-rebuild path that the deserialisation lives in.
#
# The keep rules in app/proguard-rules.pro should be sufficient on their own.
# This is the belt to their braces: the failure is silent and only shows up in
# release, which is the combination least likely to be noticed before it
# matters. A slightly larger APK is a trivial price for a reminder that
# actually arrives.
android.enableR8.fullMode=false
